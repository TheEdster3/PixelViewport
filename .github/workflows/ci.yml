name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate product site
        run: node scripts/check-site.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PixelViewport.sln
      - name: Build libraries, samples, and tools
        run: dotnet build PixelViewport.sln -c Release --no-restore
      - name: Test viewport math
        run: dotnet test tests/PixelViewport.Core.Tests/PixelViewport.Core.Tests.csproj -c Release --no-build
      - name: Test frame pipeline
        run: dotnet test tests/PixelViewport.Imaging.Tests/PixelViewport.Imaging.Tests.csproj -c Release --no-build
      - name: Test OpenCvSharp adapter
        run: dotnet test tests/PixelViewport.OpenCvSharp.Tests/PixelViewport.OpenCvSharp.Tests.csproj -c Release --no-build
      - name: Test Avalonia interactions headlessly
        run: dotnet run --project tests/PixelViewport.Avalonia.Tests/PixelViewport.Avalonia.Tests.csproj -c Release --no-build
      - name: Run conversion smoke probe
        run: dotnet run --project tools/PixelViewport.Benchmarks/PixelViewport.Benchmarks.csproj -c Release --no-build
      - name: Pack Core
        run: dotnet pack src/PixelViewport.Core/PixelViewport.Core.csproj -c Release --no-build -o artifacts/packages
      - name: Pack Imaging
        run: dotnet pack src/PixelViewport.Imaging/PixelViewport.Imaging.csproj -c Release --no-build -o artifacts/packages
      - name: Pack OpenCvSharp adapter
        run: dotnet pack src/PixelViewport.OpenCvSharp/PixelViewport.OpenCvSharp.csproj -c Release --no-build -o artifacts/packages
      - name: Pack WinUI
        run: dotnet pack src/PixelViewport.WinUI/PixelViewport.WinUI.csproj -c Release --no-build -o artifacts/packages
      - name: Pack Avalonia
        run: dotnet pack src/PixelViewport.Avalonia/PixelViewport.Avalonia.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
